<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livonia Weather</title>
    <link rel="stylesheet" href="single_page.css" />
  </head>
  <body>
    <main>
      <h1>Livonia Weather</h1>
      <dl id="weather-output" aria-live="polite">
        <dt>Name</dt>
        <dd id="location-name">Loading...</dd>
        <dt>Region</dt>
        <dd id="location-region">Loading...</dd>
        <dt>Observation time</dt>
        <dd id="observation-time">Loading...</dd>
        <dt>Temperature</dt>
        <dd id="temperature">Loading...</dd>
      </dl>
    </main>

    <script>
      fetch("https://api.apilayer.net/weatherstack/current?access_key=7ac5f6f877275ca3e68779a51e715baf&query=Livonia,Michigan&units=f")
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            throw new Error(data.error.info);
          }

          document.getElementById("location-name").textContent = data.location.name;
          document.getElementById("location-region").textContent = data.location.region;
          document.getElementById("observation-time").textContent = data.current.observation_time;
          document.getElementById("temperature").textContent = `${data.current.temperature}\u00B0F`;
        })
        
        .catch(error => {
          document.querySelectorAll("#weather-output dd").forEach(output => {
            output.textContent = `Error: ${error.message}`;
          });
        
        });
        
    </script>
  </body>
</html>
